name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest mypy

      - name: Run unit tests
        run: python -m pytest tests/ -q

      - name: Run README inventory checker
        run: python qa/check_readme.py

      - name: Type check sparehash package
        run: python -m mypy sparehash

  package-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify wheel has no runtime dependencies
        run: |
          unzip -p dist/*.whl '*/METADATA' > metadata.txt
          if grep -i '^Requires-Dist:' metadata.txt; then
            echo 'ERROR: wheel declares runtime dependencies'
            cat metadata.txt
            exit 1
          fi
          echo 'OK: wheel has no runtime dependencies'
