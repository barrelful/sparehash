name: Feature request
description: Suggest an improvement or new capability for SpareHash
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please check existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Describe the feature you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: invariants
    attributes:
      label: Confirmations
      options:
        - label: I understand that v1 intentionally excludes MSR, GPU mining, and network policy changes.
          required: false
