name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6

      - name: Install locked development dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}"

      - name: Run unit tests
        run: .venv/bin/python -m pytest tests/ -q -ra

      - name: Run README inventory checker
        run: .venv/bin/python qa/check_readme.py

      - name: Type check sparehash package
        run: .venv/bin/python -m mypy sparehash

      - name: Scoped release lint
        run: >-
          .venv/bin/ruff check sparehash/gaming_scan.py sparehash/__main__.py
          sparehash/preflight.py qa/release_smoke.py qa/check_artifacts.py
          sparehash/cli_config.py tests/test_cli_config.py tests/test_qa_local_pool.py
          qa/fixtures/synthetic_xmrig.py tests/test_release_surface.py
          tests/test_qa_release_smoke.py
          tests/test_runtime_shutdown.py
          sparehash/power.py tests/test_power_scope.py

  package-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Build wheel and sdist
        run: uv build

      - name: Verify wheel has no runtime dependencies
        run: |
          unzip -p dist/*.whl '*/METADATA' > metadata.txt
          if grep -i '^Requires-Dist:' metadata.txt; then
            echo 'ERROR: wheel declares runtime dependencies'
            cat metadata.txt
            exit 1
          fi
          echo 'OK: wheel has no runtime dependencies'

      - name: Verify shipped attribution
        run: python qa/check_artifacts.py dist
